# LANShare · coturn 裸机部署配置（use-auth-secret 模式，凭据由 lanshare 服务端签发）
# 启动：turnserver -c deploy/turnserver.conf
# 必须与 lanshare 的 -turn-secret / LANSHARE_TURN_SECRET 完全一致
#
# Docker 部署不读这个文件：密钥由 .env 的 TURN_SECRET 注入 docker-compose.yml，
# 避免出现「密钥写死在配置文件里」的情况；本文件仅供裸机部署使用。

listening-port=3478
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# 服务器在 NAT 后（云主机常见）时填写：external-ip=公网IP/内网IP
# external-ip=203.0.113.10/10.0.0.5

# TURN 中继端口段（需在防火墙/安全组放行 UDP）
# 裸机可以用大范围；Docker 版 compose 收窄为 40000-40200 以减少端口映射数量，
# 两套配置任选其一，注意不要同时用不同范围却只放行其中一段。
min-port=49152
max-port=65535

fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_SHARED_SECRET
realm=lanshare

# 只提供 STUN/TURN over UDP/TCP；WebRTC 数据本身已有 DTLS 加密，无需 TURN 层再套 TLS
no-tls
no-dtls
no-cli
no-multicast-peers
mobility

# 生产建议打开日志
# log-file=/var/log/turnserver.log
# verbose
