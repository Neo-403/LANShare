services:
  lanshare:  # LANShare 服务（页面 + 信令 + 无 TURN 时的 WS 中继）
    # image: 918178/lanshare  # Docker Hub 镜像
    image: ghcr.io/neo-403/lanshare  # GHCR 镜像
    restart: unless-stopped  # 非手动停止则总是重启
    ports:  # 端口映射
      - "8080:8080"  # 宿主机端口（由 Nginx 反代，不要直接对外）
    environment:  # 环境变量
      LANSHARE_ADDR: ":8080"  # 监听端口
      LANSHARE_NO_TLS: "1"  # 禁用 TLS（由 Nginx 提供 HTTPS）
      LANSHARE_TRUST_PROXY: "1"  # 允许外部代理
      LANSHARE_TURN_SECRET: "${TURN_SECRET:-}"  # 仅启用可选 coturn 时需要
      LANSHARE_TURN_URLS: "${TURN_URLS:-}"  # 留空 = 不下发外部 TURN
      LANSHARE_STUN_URLS: "${STUN_URLS:-}"  # 留空 = 不打洞；两项都空时直接走服务器 WS 中继
      LANSHARE_RELAY_RATE_MB: "${RELAY_RATE_MB:-0}"  # 每连接中继带宽上限(MB/s)，0 = 不限速
